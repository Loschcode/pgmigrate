name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: fmt, vet, govulncheck, test, race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-go installs the go.mod toolchain line, the supported, patched
      # stdlib that CI and releases build with. The go line is the older floor
      # the README promises, which the next step still compiles against.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build and vet at the go.mod floor (Go 1.25)
        env:
          GOTOOLCHAIN: go1.25.13
        run: go build ./... && go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: controller verification UI
        run: node --test internal/controller/ui_test.mjs
      - run: make vet
      # Reachability, not Dependabot's module list: the released binary, not the
      # integration-tagged testcontainers graph. Pinned because @latest broke
      # CI when x/vuln started requiring a newer Go; Dependabot does not bump
      # it, so move it together with the toolchain line.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./cmd/pgmigrate ./internal/...
      # Compiles the integration-tagged files without running them; those and the
      # Compose end-to-end suites need PostgreSQL and are run by hand.
      - run: make test
      - name: Controller JavaScript regression tests
        run: make ui-test
      # Apply, the copy workers, and the CDC handoff are concurrent, and a race
      # between them is not something anyone reproduces by hand twice.
      - run: make race

  clone-e2e:
    name: Physical clone COPY + source CDC (PG ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: [16, 17, 18]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Clone migration, resume, and cutover
        env:
          PG_MAJOR: ${{ matrix.postgres }}
        run: make clone-e2e
      - name: Exact clone seed boundary
        env:
          PGTEST_MAJORS: ${{ matrix.postgres }}
        run: go test -tags=integration ./internal/cdc -run '^TestPGCloneSeedAtCommitEnd$' -count=1
      - name: Clone reader and setup regressions
        if: matrix.postgres == 17
        run: go test -tags=integration ./internal/copy ./internal/setup -run 'TestPG17(CopyReaderCannotSilentlyApplyRLS|CloneRejectsWrongEndpointAndCleansSetup)$' -count=1
